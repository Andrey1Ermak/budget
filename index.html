<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#0E0F13">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Budget</title>
<style>
:root{
  --bg:#0E0F13; --card:#181A20; --card2:#21242C; --line:#2A2E37;
  --text:#F2F3F5; --dim:#8B909C; --faint:#5A5F6B;
  --green:#34C759; --red:#FF5A5F; --yellow:#FFD60A; --accent:#5E8BFF;
  --r:18px; --tabbg:rgba(14,15,19,.88); --shadow:rgba(0,0,0,.35); --veil:rgba(0,0,0,.55);
}
:root[data-theme=light]{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#EBEBF0; --line:#E0E0E6;
  --text:#111214; --dim:#6B7080; --faint:#A0A5B0;
  --green:#1FA54A; --red:#E5383F; --yellow:#E8B500; --accent:#3D6FF2;
  --tabbg:rgba(248,248,250,.9); --shadow:rgba(30,40,60,.18); --veil:rgba(0,0,0,.3);
}
:root[data-theme=light] .coin .face{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12), 0 4px 12px var(--shadow)}
:root[data-theme=light] .coin.add .face{box-shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.month{display:flex;align-items:center;gap:6px;font-weight:650;font-size:17px}
.month button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:20px}
.month button:active{background:var(--card)}
.sync{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.stale .dot{background:var(--yellow)} .sync.err .dot{background:var(--red)}

/* summary */
.summary{background:var(--card);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0 18px}
.summary div{display:flex;flex-direction:column;gap:2px}
.summary small{color:var(--dim);font-size:12px}
.summary b{font-size:18px;font-weight:650}
.pos{color:var(--green)} .neg{color:var(--red)}

/* sections */
h3{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h3 button{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:500;font-size:14px}
.row{display:flex;gap:14px;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:0 2px}

/* coin = category bubble */
.coin{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px;position:relative}
.coin .ring{position:relative;width:62px;height:62px}
.coin svg{position:absolute;inset:0;transform:rotate(-90deg)}
.coin .face{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 4px 14px var(--shadow)}
.coin .name{font-size:12px;color:var(--dim);max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin .amt{font-size:13px;font-weight:600}
.coin .amt.zero{color:var(--faint);font-weight:500}
.coin:active .face{transform:scale(.94)}
.coin .badge{position:absolute;top:-2px;right:6px;background:var(--yellow);color:#000;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.coin.add .face{background:var(--card2)!important;color:var(--dim);font-size:26px;box-shadow:none;border:1.5px dashed var(--line)}
.coin.attn .face{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,.45)}50%{box-shadow:0 0 0 7px rgba(255,214,10,0)}}

/* lists */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.day{font-size:12px;color:var(--faint);padding:14px 16px 6px;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--dim)}
.tx .a{font-weight:600}
.tx:active{background:var(--card2)}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--dim);margin-left:6px;vertical-align:1px}
.pill.y{background:rgba(255,214,10,.15);color:var(--yellow)}
.empty{color:var(--faint);text-align:center;padding:40px 10px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--faint);width:76px}
.tabs button span{font-size:21px;filter:grayscale(1) opacity(.6)}
.tabs button.on{color:var(--text)} .tabs button.on span{filter:none}

/* sheet */
.veil{position:fixed;inset:0;background:var(--veil);opacity:0;pointer-events:none;transition:.2s;z-index:10}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:11;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:18px;margin:4px 0 4px}
.sheet .sub{color:var(--dim);font-size:13px;margin-bottom:14px;word-break:break-word}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;text-align:center;margin-top:12px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--red)}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:12px;padding:12px 14px;margin:12px 0}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw::after{box-shadow:0 1px 3px rgba(0,0,0,.25);content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)} .sw.on::after{left:21px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--text)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{flex:1;padding:7px;border-radius:8px;color:var(--dim);font-size:13px;font-weight:600}
.seg button.on{background:var(--card);color:var(--text)}

/* reports */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.legend .li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.legend .li:first-child{border-top:0}
.legend .sq{width:10px;height:10px;border-radius:3px}
.legend .bar{height:4px;border-radius:2px;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bars .b{width:40%;border-radius:4px 4px 0 0;min-height:2px}
.bars small{font-size:11px;color:var(--faint)}

.search{margin:8px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:16px;background:var(--card);color:var(--dim);font-size:13px}
.chip.on{background:var(--text);color:var(--bg)}

.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:4px}
.lock .logo{font-size:52px;text-align:center}
.lock h1{text-align:center;margin:6px 0 2px;font-size:26px}
.lock p{text-align:center;color:var(--dim);margin:0 0 18px;font-size:14px}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-80px);background:var(--card2);
  padding:10px 16px;border-radius:14px;font-size:14px;transition:.25s;z-index:20;box-shadow:0 8px 30px var(--shadow);max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<nav class="tabs hidden" id="tabs">
  <button data-tab="overview" class="on"><span>🪙</span>Overview</button>
  <button data-tab="tx"><span>🧾</span>Transactions</button>
  <button data-tab="reports"><span>📊</span>Reports</button>
  <button data-tab="settings"><span>⚙️</span>Settings</button>
</nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =================== storage =================== */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem("bgt."+k); return v===null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("bgt."+k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem("bgt."+k); }catch{} }
};
const S = {
  cfg: LS.get("cfg", { repo:"Andrey1Ermak/budget-data", token:"", pass:"" }),
  data: null,            // {accounts, transactions, generated_at}
  cats: null,            // {income:[], expense:[]}
  rules: null, rulesSha: null,
  overrides: {}, ovSha: null, catsSha: null, acctNames: {}, acctSha: null,
  month: (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),
  tab: "overview", txFilter: "all", q: "", syncState: "ok"
};
const SYS = {
  transfer:        {id:"transfer", name:"Transfer", icon:"🔁", color:"#3A3F4B", sys:true},
  uncategorized:   {id:"uncategorized", name:"Uncategorized", icon:"❓", color:"#C2A548", sys:true},
  uncategorized_in:{id:"uncategorized_in", name:"Uncategorized", icon:"❓", color:"#C2A548", sys:true},
};
const COLORS = ["#34C759","#30B0C7","#5E8BFF","#5E5CE6","#BF5AF2","#FF6B6B","#FF9F0A","#FFD60A","#A2845E","#8E8E93","#64D2FF","#FF375F"];

/* =================== theme =================== */
const mqLight = matchMedia("(prefers-color-scheme: light)");
function applyTheme(){
  const pref = LS.get("theme","light"), t = pref==="auto" ? (mqLight.matches?"light":"dark") : pref;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t==="light" ? "#F2F2F7" : "#0E0F13";
  document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').content = t==="light" ? "default" : "black-translucent";
}
applyTheme();
(mqLight.addEventListener ? mqLight.addEventListener("change", applyTheme) : mqLight.addListener(applyTheme));

/* =================== crypto (mirrors scripts/sync.py) =================== */
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptEnv(env, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(env.salt), iterations:env.iter, hash:"SHA-256"},
                                            base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(env.iv)}, key, b64d(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* =================== GitHub =================== */
const api = p => `https://api.github.com/repos/${S.cfg.repo}/contents/${p}`;
const hdr = (raw) => ({ "Authorization":"Bearer "+S.cfg.token, "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" });
const utf8b64 = s => { const b = new TextEncoder().encode(s); let out=""; for (let i=0;i<b.length;i+=0x8000) out += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(out); };
const b64utf8 = s => new TextDecoder().decode(b64d(s.replace(/\n/g,"")));

async function ghRaw(path){
  const r = await fetch(api(path)+"?t="+Date.now(), {headers:hdr(true), cache:"no-store"});
  if (r.status===404) return null;
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.text();
}
async function ghJson(path){
  const r = await fetch(api(path)+"?t="+Date.now(), {headers:hdr(false), cache:"no-store"});
  if (r.status===404) return {json:null, sha:null};
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  return {json: JSON.parse(b64utf8(j.content)), sha: j.sha};
}
async function ghPut(path, obj, sha, msg){
  const body = {message: msg, content: utf8b64(JSON.stringify(obj, null, 2)+"\n")};
  if (sha) body.sha = sha;
  const r = await fetch(api(path), {method:"PUT", headers:{...hdr(false),"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (r.status===409 || r.status===422) throw new Error("conflict");
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return (await r.json()).content.sha;
}
/* read-modify-write with one retry on conflict */
async function updateRemote(path, shaKey, mutate, msg){
  for (let i=0;i<2;i++){
    const {json, sha} = await ghJson(path);
    const next = mutate(json);
    try { S[shaKey] = await ghPut(path, next, sha, msg); return next; }
    catch(e){ if (e.message!=="conflict" || i) throw e; }
  }
}

/* =================== load =================== */
async function loadAll({silent=false}={}){
  // 1) instant render from cache
  const cached = LS.get("cache");
  if (cached && !S.data){
    try{
      S.data = await decryptEnv(cached.env, S.cfg.pass);
      S.cats = cached.cats; S.rules = cached.rules; S.overrides = cached.overrides||{}; S.acctNames = cached.acctNames||{};
      render();
    }catch(e){ /* wrong pass -> fall through */ }
  }
  // 2) network
  setSync("loading");
  try{
    const [envTxt, cats, rules, ov, an] = await Promise.all([ghRaw("data.enc.json"), ghJson("categories.json"), ghJson("rules.json"), ghJson("overrides.json"), ghJson("accounts.json")]);
    S.cats = cats.json || {income:[],expense:[]}; S.catsSha = cats.sha;
    S.rules = rules.json || {rules:[]}; S.rulesSha = rules.sha;
    S.overrides = ov.json || {}; S.ovSha = ov.sha;
    S.acctNames = an.json || {}; S.acctSha = an.sha;
    if (envTxt){
      const env = JSON.parse(envTxt);
      S.data = await decryptEnv(env, S.cfg.pass);
      LS.set("cache", {env, cats:S.cats, rules:S.rules, overrides:S.overrides, acctNames:S.acctNames});
    } else if (!S.data){
      S.data = {accounts:{}, transactions:[], generated_at:null};
    }
    applyLocalOverrides();
    setSync("ok");
  }catch(e){
    console.warn(e);
    if (e.name==="OperationError") throw new Error("Wrong password");
    if (!S.data) throw e;
    setSync("err");
    if (!silent) toast("Offline — showing cached data");
  }
  render();
}
function applyLocalOverrides(){
  if (!S.data) return;
  for (const t of S.data.transactions){
    if (S.overrides[t.id]) { t.category = S.overrides[t.id]; t.cat_source = "manual"; }
  }
}

/* =================== helpers =================== */
const fmt = (n, sign=false) => {
  const s = Math.abs(n).toLocaleString("en-US", {style:"currency", currency:"USD", maximumFractionDigits: Math.abs(n)>=1000?0:2});
  return (sign && n>0 ? "+" : n<0 ? "−" : "") + s;
};
const fmtShort = n => { const a=Math.abs(n); return "$"+(a>=10000? (a/1000).toFixed(0)+"k" : a>=1000? (a/1000).toFixed(1)+"k" : a.toFixed(0)); };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const txDate = t => new Date(((t.posted||t.transacted_at) || Date.now()/1000) * 1000);
const inMonth = (t, y, m) => { const d = txDate(t); return d.getFullYear()===y && d.getMonth()===m; };
const allCats = () => [...(S.cats?.income||[]).map(c=>({...c,type:"income"})), ...(S.cats?.expense||[]).map(c=>({...c,type:"expense"}))];
const catById = id => allCats().find(c=>c.id===id) || SYS[id] || {id, name:id||"?", icon:"•", color:"#3A3F4B"};
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function acctName(id){
  if (S.acctNames[id]) return S.acctNames[id];
  const a = S.data?.accounts?.[id]; if (!a) return "";
  const n = a.name || "";
  for (const k of ["Checking","Savings","Freedom","Sapphire","Amazon","Ink","Slate","United","Southwest","Marriott","Hyatt","IHG"])
    if (new RegExp("\\b"+k+"\\b","i").test(n)) return k;
  return n.replace(/^chase\s*/i,"") || a.org || "Account";
}
const isTransfer = t => t.category==="transfer";
const isIncome = t => !isTransfer(t) && t.amount>0 && (catById(t.category).type==="income" || t.category==="uncategorized_in");
const isExpense = t => !isTransfer(t) && !isIncome(t);   // refunds (+) on expense cats reduce spend

function monthTx(y=S.month.y, m=S.month.m){ return (S.data?.transactions||[]).filter(t=>inMonth(t,y,m)); }
function totals(list){
  const by = {}; let inc=0, exp=0;
  for (const t of list){
    if (isTransfer(t)) continue;
    if (isIncome(t)){ inc += t.amount; by[t.category]=(by[t.category]||0)+t.amount; }
    else { exp += -t.amount; by[t.category]=(by[t.category]||0)+(-t.amount); }
  }
  return {inc, exp, by};
}
function prettyDesc(t){
  const s = (t.payee || t.description || "").replace(/\s{2,}/g," ").trim();
  return s.length>40 ? s.slice(0,40)+"…" : s;
}

/* =================== UI primitives =================== */
const $app = document.getElementById("app");
function coin(c, amount, opts={}){
  const budget = opts.budget||0, pct = budget>0 ? Math.min(amount/budget,1) : 0, over = budget>0 && amount>budget;
  const R=29, C=2*Math.PI*R;
  const ring = budget>0 ? `<svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="3"/>
     <circle cx="31" cy="31" r="${R}" fill="none" stroke="${over?'#FF5A5F':c.color}" stroke-width="3" stroke-linecap="round"
     stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>` : "";
  return `<button class="coin ${opts.cls||""}" data-cat="${esc(c.id)}">
    ${opts.badge?`<span class="badge">${opts.badge}</span>`:""}
    <div class="ring">${ring}<div class="face" style="background:${c.color}">${c.icon}</div></div>
    <div class="name">${esc(c.name)}</div>
    <div class="amt num ${amount? "":"zero"}">${opts.text ?? fmt(amount)}</div>
  </button>`;
}
function txRow(t){
  const c = catById(t.category);
  return `<div class="tx" data-tx="${esc(t.id)}">
    <div class="ic" style="background:${c.color}">${c.icon}</div>
    <div class="mid"><div class="t1">${esc(prettyDesc(t))}${t.pending?'<span class="pill">pending</span>':''}${t.cat_source==="unknown"?'<span class="pill y">review</span>':''}</div>
      <div class="t2">${esc(c.name)} · ${esc(acctName(t.account))}</div></div>
    <div class="a num ${t.amount>0?"pos":""}">${fmt(t.amount, true)}</div></div>`;
}
function txList(list){
  if (!list.length) return `<div class="empty">No transactions</div>`;
  const days = {};
  for (const t of list){ const k = txDate(t).toDateString(); (days[k] ||= []).push(t); }
  return Object.entries(days).map(([k, ts]) => {
    const d = new Date(k), net = ts.filter(t=>!isTransfer(t)).reduce((s,t)=>s+t.amount,0);
    return `<div class="day"><span>${d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"})}</span><span class="num">${fmt(net,true)}</span></div>
      <div class="list">${ts.map(txRow).join("")}</div>`;
  }).join("");
}
function monthHeader(){
  const {y,m} = S.month, gen = S.data?.generated_at ? new Date(S.data.generated_at) : null;
  const ago = gen ? Math.round((Date.now()-gen)/3600000) : null;
  const cls = S.syncState==="err" ? "err" : (ago!==null && ago>30 ? "stale" : "");
  const label = S.syncState==="loading" ? "Syncing…" : gen ? (ago<1?"Updated just now": ago<24? `Updated ${ago}h ago` : `Updated ${Math.round(ago/24)}d ago`) : "No data yet";
  return `<div class="top">
    <div class="month"><button id="mPrev">‹</button><span>${MONTHS[m]} ${y}</span><button id="mNext">›</button></div>
    <button class="sync ${cls}" id="refresh"><span class="dot"></span>${label}</button></div>`;
}

/* =================== views =================== */
function viewOverview(){
  const list = monthTx(), {inc, exp, by} = totals(list), net = inc-exp;
  const unc = list.filter(t=>t.cat_source==="unknown" && !isTransfer(t));
  const accounts = Object.entries(S.data.accounts||{});
  let h = monthHeader();
  h += `<div class="summary"><div><small>Income</small><b class="num pos">${fmt(inc)}</b></div>
        <div><small>Expenses</small><b class="num">${fmt(exp)}</b></div>
        <div><small>Net</small><b class="num ${net>=0?"pos":"neg"}">${fmt(net,true)}</b></div></div>`;

  h += `<h3>Income</h3><div class="row">`;
  for (const c of S.cats.income) h += coin(c, by[c.id]||0);
  if (by.uncategorized_in) h += coin(SYS.uncategorized_in, by.uncategorized_in, {cls:"attn"});
  h += coin({id:"__add_income", name:"Add", icon:"+", color:"#000"}, 0, {cls:"add", text:""});
  h += `</div>`;

  if (accounts.length){
    h += `<h3>Accounts</h3><div class="row">`;
    for (const [id,a] of accounts){
      const nm = acctName(id);
      h += `<div class="coin" data-acct="${esc(id)}"><div class="ring"><div class="face" style="background:#1F4FB8">🏦</div></div>
        <div class="name">${esc(nm)}</div><div class="amt num ${a.balance<0?"neg":""}">${fmt(a.balance)}</div></div>`;
    }
    h += `</div>`;
  }

  h += `<h3>Expenses</h3><div class="grid">`;
  for (const c of S.cats.expense) h += coin(c, by[c.id]||0, {budget:c.budget});
  if (unc.filter(t=>t.amount<0).length) h += coin(SYS.uncategorized, by.uncategorized||0, {cls:"attn", badge: unc.filter(t=>t.amount<0).length});
  h += coin({id:"__add_expense", name:"Add", icon:"+", color:"#000"}, 0, {cls:"add", text:""});
  h += `</div>`;

  const recent = list.filter(t=>!isTransfer(t)).slice(0,6);
  h += `<h3>Recent <button data-goto="tx">See all</button></h3>${recent.length? `<div class="list">${recent.map(txRow).join("")}</div>` : `<div class="empty">${S.data.generated_at? "Nothing this month yet" : "Waiting for the first sync…"}</div>`}`;
  return h;
}

function viewTx(){
  let list = monthTx();
  const f = S.txFilter, q = S.q.trim().toLowerCase();
  if (f==="review") list = list.filter(t=>t.cat_source==="unknown");
  else if (f==="transfer") list = list.filter(isTransfer);
  else if (f!=="all") list = list.filter(t=>t.category===f);
  else list = list.filter(t=>!isTransfer(t));
  if (q) list = list.filter(t=>(t.description+" "+(t.payee||"")+" "+catById(t.category).name+" "+acctName(t.account)).toLowerCase().includes(q) || String(Math.abs(t.amount)).includes(q));
  const chips = [["all","All"],["review","Needs review"],...allCats().map(c=>[c.id,c.icon+" "+c.name]),["transfer","🔁 Transfers"]];
  return monthHeader() + `<input class="search" id="q" placeholder="Search" value="${esc(S.q)}">
    <div class="chips">${chips.map(([id,l])=>`<button class="chip ${f===id?"on":""}" data-filter="${esc(id)}">${esc(l)}</button>`).join("")}</div>
    ${txList(list)}`;
}

function donut(parts, total){
  const R=70, C=2*Math.PI*R; let off=0;
  const segs = parts.map(p=>{ const len = total? C*p.v/total : 0;
    const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(len-2,0)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len; return s; }).join("");
  return `<svg viewBox="0 0 180 180" width="180" height="180" style="display:block;margin:0 auto">
    <g transform="rotate(-90 90 90)"><circle cx="90" cy="90" r="${R}" fill="none" style="stroke:var(--card2)" stroke-width="22"/>${segs}</g>
    <text x="90" y="86" text-anchor="middle" style="fill:var(--dim)" font-size="12">Spent</text>
    <text x="90" y="106" text-anchor="middle" style="fill:var(--text)" font-size="19" font-weight="650">${fmt(total)}</text></svg>`;
}
function viewReports(){
  const {exp, by} = totals(monthTx());
  const parts = [...S.cats.expense, SYS.uncategorized].map(c=>({...c, v: Math.max(by[c.id]||0,0)})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);
  let h = monthHeader() + `<div class="card">${donut(parts, exp)}<div class="legend" style="margin-top:14px">` +
    (parts.length? parts.map(p=>`<div class="li" data-cat="${esc(p.id)}"><span class="sq" style="background:${p.color}"></span>
      <div style="flex:1"><div style="display:flex;justify-content:space-between"><span>${p.icon} ${esc(p.name)}</span><span class="num">${fmt(p.v)} <small style="color:var(--faint)">${Math.round(p.v/exp*100)}%</small></span></div>
      <div class="bar" style="background:${p.color};width:${p.v/parts[0].v*100}%"></div></div></div>`).join("") : `<div class="empty">No expenses</div>`) + `</div></div>`;
  // 6-month trend
  const months = []; for (let i=5;i>=0;i--){ const d = new Date(S.month.y, S.month.m-i, 1); months.push({y:d.getFullYear(), m:d.getMonth(), ...totals(monthTx(d.getFullYear(), d.getMonth()))}); }
  const max = Math.max(1, ...months.map(x=>Math.max(x.inc,x.exp)));
  h += `<h3>Last 6 months</h3><div class="card"><div class="bars">${months.map(x=>`<div class="col"><div class="pair">
      <div class="b" style="background:var(--green);height:${x.inc/max*100}%"></div><div class="b" style="background:var(--red);height:${x.exp/max*100}%"></div></div>
      <small>${MONTHS[x.m].slice(0,3)}</small></div>`).join("")}</div>
      <div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12px;color:var(--dim)"><span><span class="sq" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--green)"></span> Income</span><span><span class="sq" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--red)"></span> Expenses</span></div></div>`;
  return h;
}

function viewSettings(){
  const catRow = c => `<div class="tx" data-edit="${esc(c.id)}"><div class="ic" style="background:${c.color}">${c.icon}</div>
     <div class="mid"><div class="t1">${esc(c.name)}</div>${c.budget? `<div class="t2">Budget ${fmt(c.budget)}/mo</div>`:""}</div><div style="color:var(--faint)">›</div></div>`;
  const th = LS.get("theme","light");
  return `<div class="top"><div class="month" style="padding-left:4px">Settings</div></div>
    <h3>Appearance</h3><div class="seg">${["auto","light","dark"].map(x=>`<button data-theme-set="${x}" class="${th===x?"on":""}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
    <h3>Income sources <button data-new="income">+ Add</button></h3><div class="list">${S.cats.income.map(catRow).join("")}</div>
    <h3>Expense categories <button data-new="expense">+ Add</button></h3><div class="list">${S.cats.expense.map(catRow).join("")}</div>
    <h3>Auto-rules</h3><div class="list"><div class="tx"><div class="mid"><div class="t1">${(S.rules?.rules||[]).length} merchant rules</div><div class="t2">Created automatically and when you choose “always”</div></div></div></div>
    <h3>Connection</h3><div class="list"><div class="tx"><div class="mid"><div class="t1">${esc(S.cfg.repo)}</div><div class="t2">Last sync: ${S.data?.generated_at? new Date(S.data.generated_at).toLocaleString("en-US"):"—"}</div></div></div></div>
    <button class="btn ghost" id="runSync">Refresh now</button>
    <button class="btn danger" id="logout">Sign out on this device</button>`;
}

/* =================== render & routing =================== */
function render(){
  if (!S.data || !S.cats) return;
  document.getElementById("tabs").classList.remove("hidden");
  const v = {overview:viewOverview, tx:viewTx, reports:viewReports, settings:viewSettings}[S.tab];
  const qFocused = document.activeElement?.id==="q", pos = document.activeElement?.selectionStart;
  $app.innerHTML = v();
  if (qFocused){ const q=document.getElementById("q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch{} }
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
}
function setSync(s){ S.syncState = s; if (S.data) render(); }

document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  S.tab = b.dataset.tab; window.scrollTo(0,0); render();
});
$app.addEventListener("input", e=>{ if (e.target.id==="q"){ S.q = e.target.value; render(); } });
$app.addEventListener("click", e=>{
  const t = e.target;
  if (t.closest("#mPrev")) return shiftMonth(-1);
  if (t.closest("#mNext")) return shiftMonth(1);
  if (t.closest("#refresh") || t.closest("#runSync")) return loadAll();
  if (t.closest("#logout")) return logout();
  const ts = t.closest("[data-theme-set]"); if (ts){ LS.set("theme", ts.dataset.themeSet); applyTheme(); return render(); }
  const go = t.closest("[data-goto]"); if (go){ S.tab = go.dataset.goto; S.txFilter="all"; return render(); }
  const f = t.closest("[data-filter]"); if (f){ S.txFilter = f.dataset.filter; return render(); }
  const ac = t.closest("[data-acct]"); if (ac) return openAcct(ac.dataset.acct);
  const tx = t.closest("[data-tx]"); if (tx) return openTx(tx.dataset.tx);
  const ed = t.closest("[data-edit]"); if (ed) return openCatEditor(ed.dataset.edit);
  const nw = t.closest("[data-new]"); if (nw) return openCatEditor(null, nw.dataset.new);
  const c = t.closest("[data-cat]");
  if (c){
    const id = c.dataset.cat;
    if (id==="__add_income") return openCatEditor(null,"income");
    if (id==="__add_expense") return openCatEditor(null,"expense");
    S.tab="tx"; S.txFilter = (id==="uncategorized"||id==="uncategorized_in") ? "review" : id; window.scrollTo(0,0); render();
  }
});
function shiftMonth(d){ const x = new Date(S.month.y, S.month.m+d, 1); S.month={y:x.getFullYear(), m:x.getMonth()}; render(); }

/* swipe months */
let sx=null, sy=null;
$app.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
$app.addEventListener("touchend", e=>{ if (sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if (Math.abs(dx)>70 && Math.abs(dy)<40 && S.tab!=="settings") shiftMonth(dx<0?1:-1); sx=null; }, {passive:true});

/* =================== sheets =================== */
const $sheet = document.getElementById("sheet"), $veil = document.getElementById("veil");
function openSheet(html){ $sheet.innerHTML = `<div class="grab"></div>`+html; $sheet.classList.add("on"); $veil.classList.add("on"); }
function closeSheet(){ $sheet.classList.remove("on"); $veil.classList.remove("on"); }
$veil.addEventListener("click", closeSheet);

function openTx(id){
  const t = S.data.transactions.find(x=>x.id===id); if (!t) return;
  const cur = t.category, groups = t.amount>0 ? ["income","expense"] : ["expense","income"];
  let always = t.cat_source==="unknown";
  const opt = c => `<button class="coin" data-pick="${esc(c.id)}" style="${c.id===cur?"opacity:1":"opacity:.75"}">
      <div class="ring"><div class="face" style="background:${c.color};${c.id===cur?"outline:2px solid var(--text);outline-offset:2px":""}">${c.icon}</div></div><div class="name">${esc(c.name)}</div></button>`;
  openSheet(`<h2 class="num ${t.amount>0?"pos":""}">${fmt(t.amount,true)}</h2>
    <div class="sub">${esc(t.description)}<br>${txDate(t).toLocaleDateString("en-US",{dateStyle:"medium"})} · ${esc(acctName(t.account))}${t.pending?" · pending":""}</div>
    ${groups.map(g=>`<h3 style="margin-top:6px">${g==="income"?"Income":"Expenses"}</h3><div class="grid">${S.cats[g].map(opt).join("")}</div>`).join("")}
    <h3>Other</h3><div class="grid">${opt(SYS.transfer)}</div>
    <div class="toggle" id="alw"><div><div>Always for this merchant</div><div style="font-size:12px;color:var(--dim)">${esc(t.merchant||"")}</div></div><div class="sw ${always?"on":""}"></div></div>`);
  $sheet.querySelector("#alw").onclick = e => { always = !always; e.currentTarget.querySelector(".sw").classList.toggle("on", always); };
  $sheet.querySelectorAll("[data-pick]").forEach(b=> b.onclick = () => setCategory(t, b.dataset.pick, always));
}

async function setCategory(t, catId, always){
  closeSheet();
  const merchant = t.merchant;
  // optimistic local update
  const affected = always && merchant ? S.data.transactions.filter(x=>x.merchant===merchant && x.cat_source!=="manual") : [t];
  affected.forEach(x=>{ x.category = catId; x.cat_source = x===t ? "manual" : "rule"; });
  S.overrides[t.id] = catId; render();
  try{
    if (always && merchant){
      const match = reEsc(merchant), sign = catId==="transfer" ? undefined : (t.amount>0 ? "in" : "out");
      await updateRemote("rules.json","rulesSha", j => { j ||= {rules:[]};
        j.rules = j.rules.filter(r=>!(r.match===match && (r.amount_sign||null)===(sign||null)));
        j.rules.unshift({match, category:catId, ...(sign?{amount_sign:sign}:{}), source:"user"}); S.rules=j; return j; },
        `rule: ${merchant} → ${catId}`);
    }
    await updateRemote("overrides.json","ovSha", j => { j ||= {}; j[t.id]=catId; S.overrides=j; return j; }, `override ${catId}`);
    toast(always ? `Saved · future “${merchant.slice(0,24)}” → ${catById(catId).name}` : `Saved → ${catById(catId).name}`);
  }catch(e){ console.warn(e); toast("Couldn’t save — check connection"); }
}

function openAcct(id){
  const a = S.data.accounts[id]||{};
  openSheet(`<h2>Account</h2><div class="sub">${esc(a.name||"")}${a.org? " · "+esc(a.org):""}<br>Balance ${fmt(a.balance||0)}</div>
    <div class="field"><label>Display name</label><input id="anName" value="${esc(acctName(id))}" maxlength="16"></div>
    <button class="btn" id="anSave">Save</button>
    <button class="btn ghost" id="anTx">Show transactions</button>`);
  $sheet.querySelector("#anTx").onclick = () => { closeSheet(); S.tab="tx"; S.txFilter="all"; S.q=acctName(id); window.scrollTo(0,0); render(); };
  $sheet.querySelector("#anSave").onclick = async () => {
    const name = $sheet.querySelector("#anName").value.trim(); closeSheet();
    if (name) S.acctNames[id]=name; else delete S.acctNames[id]; render();
    try{ await updateRemote("accounts.json","acctSha", j => { j ||= {}; if (name) j[id]=name; else delete j[id]; S.acctNames=j; return j; }, "account name"); toast("Saved"); }
    catch(e){ console.warn(e); toast("Couldn’t save — check connection"); }
  };
}
function openCatEditor(id, type){
  const existing = id ? allCats().find(c=>c.id===id) : null;
  type = existing ? existing.type : type;
  const c = existing ? {...existing} : {name:"", icon: type==="income"?"💰":"🏷️", color: COLORS[(S.cats[type].length*3)%COLORS.length], budget:0};
  openSheet(`<h2>${existing? "Edit" : "New"} ${type==="income"?"income source":"category"}</h2><div class="sub">One word works best</div>
    <div style="display:flex;gap:10px"><div class="field" style="width:76px"><label>Icon</label><input id="ceIcon" value="${esc(c.icon)}" maxlength="4" style="text-align:center;font-size:22px;padding:8px"></div>
    <div class="field" style="flex:1"><label>Name</label><input id="ceName" value="${esc(c.name)}" maxlength="18" placeholder="${type==="income"?"Freelance":"Travel"}"></div></div>
    ${type==="expense"? `<div class="field"><label>Monthly budget (optional)</label><input id="ceBudget" type="number" inputmode="decimal" placeholder="0" value="${c.budget||""}"></div>`:""}
    <div class="field"><label>Color</label><div class="swatches">${COLORS.map(col=>`<button data-col="${col}" class="${col===c.color?"on":""}" style="background:${col}"></button>`).join("")}</div></div>
    <button class="btn" id="ceSave">Save</button>${existing? `<button class="btn danger" id="ceDel">Delete</button>`:""}`);
  $sheet.querySelectorAll("[data-col]").forEach(b=> b.onclick=()=>{ c.color=b.dataset.col; $sheet.querySelectorAll("[data-col]").forEach(x=>x.classList.toggle("on",x===b)); });
  $sheet.querySelector("#ceSave").onclick = async () => {
    const name = $sheet.querySelector("#ceName").value.trim(); if (!name) return toast("Enter a name");
    c.name = name; c.icon = $sheet.querySelector("#ceIcon").value.trim() || "•";
    if (type==="expense") c.budget = parseFloat($sheet.querySelector("#ceBudget").value)||0;
    if (!existing){ let base = name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"cat", nid=base, i=2;
      while (allCats().some(x=>x.id===nid) || SYS[nid]) nid = base+"_"+(i++); c.id = nid; }
    delete c.type; await saveCats(j => { const arr = j[type]; const k = arr.findIndex(x=>x.id===c.id); if (k>=0) arr[k]=c; else arr.push(c); return j; });
  };
  if (existing) $sheet.querySelector("#ceDel").onclick = async () => {
    const used = S.data.transactions.filter(t=>t.category===existing.id).length;
    if (used && !confirm(`${used} transactions use “${existing.name}”. They will show as Uncategorized until reassigned. Delete?`)) return;
    await saveCats(j => { j[type] = j[type].filter(x=>x.id!==existing.id); return j; });
  };
}
async function saveCats(mutate){
  closeSheet();
  S.cats = mutate(JSON.parse(JSON.stringify(S.cats))); render();
  try{ await updateRemote("categories.json","catsSha", j => { const n = mutate(j || {income:[],expense:[]}); S.cats = n; return n; }, "categories"); toast("Saved"); render(); }
  catch(e){ console.warn(e); toast("Couldn’t save — check connection"); }
}

/* =================== auth =================== */
function viewLock(err=""){
  document.getElementById("tabs").classList.add("hidden");
  const c = S.cfg;
  $app.innerHTML = `<div class="lock"><div class="logo">🪙</div><h1>Budget</h1><p>${c.token? "Enter your password" : "Connect this device once"}</p>
    ${c.token? "" : `<div class="field"><label>GitHub token (budget-data, Contents: read & write)</label><input id="lkTok" type="password" autocomplete="off" placeholder="github_pat_…"></div>
    <div class="field"><label>Data repository</label><input id="lkRepo" value="${esc(c.repo)}"></div>`}
    <div class="field"><label>Password</label><input id="lkPass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="lkGo">Unlock</button><div class="err">${esc(err)}</div></div>`;
  const go = async () => {
    const btn = document.getElementById("lkGo"); btn.textContent = "Unlocking…";
    if (!c.token){ S.cfg.token = document.getElementById("lkTok").value.trim(); S.cfg.repo = document.getElementById("lkRepo").value.trim(); }
    S.cfg.pass = document.getElementById("lkPass").value;
    try{ S.data=null; await loadAll(); LS.set("cfg", S.cfg); }
    catch(e){ const msg = e.message==="Wrong password" ? "Wrong password" : /401|403/.test(e.message) ? "GitHub token rejected" : /404/.test(e.message) ? "Repository not found" : e.message;
      if (msg!=="Wrong password") S.cfg.token = c.token || ""; S.data=null; viewLock(msg); }
  };
  document.getElementById("lkGo").onclick = go;
  document.getElementById("lkPass").onkeydown = e => { if (e.key==="Enter") go(); };
}
function logout(){ if (!confirm("Remove token, password and cached data from this device?")) return; LS.del("cfg"); LS.del("cache"); location.reload(); }

/* =================== toast =================== */
let tt; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2600); }

/* =================== boot =================== */
(async function boot(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if (!S.cfg.token || !S.cfg.pass) return viewLock();
  try{ await loadAll(); }catch(e){ viewLock(e.message==="Wrong password"?"Wrong password":""); }
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && S.data) loadAll({silent:true}); });
})();
</script>
